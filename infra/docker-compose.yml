services:
  db:
    image: postgres:16-alpine
    container_name: studylog-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-studylog}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-studylog}
      POSTGRES_DB: ${POSTGRES_DB:-studylog}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - studylog_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  studylog_db_data:
